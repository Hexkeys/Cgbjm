<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>RemotePad</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f1115;color:#e8eaf0;font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
.view{display:none;height:100dvh}
.view.active{display:flex}
button{font:inherit;color:inherit;border:0;background:#262b36;border-radius:8px;padding:8px 12px;cursor:pointer}
button:active{background:#323847}
input,select{font:inherit;color:inherit;background:#181b22;border:1px solid #2c3240;border-radius:8px;padding:10px 12px;user-select:text;-webkit-user-select:text}
.center{margin:auto;width:min(92vw,360px);display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:22px}
.muted{color:#8b92a5;font-size:13px}
.err{color:#ff7b7b;min-height:18px;font-size:13px}
.primary{background:#4f8cff;color:#fff}
#devices .wrap{margin:0 auto;width:min(94vw,520px);padding:24px 0;display:flex;flex-direction:column;gap:10px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dev{display:flex;justify-content:space-between;align-items:center;background:#181b22;border-radius:12px;padding:14px 16px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;display:inline-block;margin-right:8px}

#control{flex-direction:column}
.top{display:flex;gap:6px;align-items:center;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:#181b22}
.top .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top button.on{background:#4f8cff}
.top select{padding:7px 8px}
.screen{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
#cv{max-width:100%;max-height:100%;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.65);color:#cfd4e2;text-align:center;padding:20px;pointer-events:none}
#overlay[hidden]{display:none}
.panel{background:#181b22;padding-bottom:env(safe-area-inset-bottom)}
.tabs{display:flex;gap:6px;padding:6px 8px}
.tabs button{flex:1}
.tabs button.on{background:#4f8cff;color:#fff}
.tab{display:none}
.tab.active{display:block}

.speed{display:flex;align-items:center;gap:8px;padding:0 10px 6px;font-size:12px;color:#8b92a5}
.speed input{flex:1;padding:0}
.padwrap{display:flex;gap:8px;padding:0 8px 8px;height:220px}
.pad{flex:1;background:#12151b;border:1px solid #2c3240;border-radius:14px;touch-action:none;display:flex;align-items:center;justify-content:center;color:#4a5164;font-size:12px;text-align:center;padding:12px;line-height:1.6}
.strip{width:42px;background:#12151b;border:1px solid #2c3240;border-radius:14px;touch-action:none;display:flex;align-items:center;justify-content:center;color:#4a5164;font-size:11px;writing-mode:vertical-rl}
.btns{display:flex;flex-direction:column;gap:8px;width:72px}
.btns button{flex:1;touch-action:none}
.btns button.on{background:#4f8cff;color:#fff}

.kb{padding:0 6px 8px;display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:4px}
.row.scroll{overflow-x:auto;scrollbar-width:none}
.row.scroll::-webkit-scrollbar{display:none}
.k{flex:var(--w,1) 1 0;min-width:0;height:42px;padding:0;display:flex;align-items:center;justify-content:center;background:#262b36;border-radius:7px;touch-action:manipulation;font-size:15px}
.k.sm{flex:0 0 auto;min-width:46px;height:34px;padding:0 10px;font-size:13px}
.k.on{background:#4f8cff;color:#fff}
.k:active{background:#3b4254}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" class="view active">
  <form class="center" id="loginForm">
    <h1>RemotePad</h1>
    <div class="muted">Enter your access password.</div>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="primary" type="submit">Sign in</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<!-- DEVICES -->
<section id="devices" class="view">
  <div class="wrap">
    <div class="hdr"><h1>Your PCs</h1><button id="logout">Sign out</button></div>
    <div id="devList"></div>
    <div class="muted" id="devEmpty">No PCs online. Start RemotePad-Agent.exe on a computer.</div>
  </div>
</section>

<!-- CONTROL -->
<section id="control" class="view">
  <div class="top">
    <button id="back">←</button>
    <div class="title" id="title">PC</div>
    <button id="directTap" class="on" title="Tap the screen to click">👆</button>
    <select id="quality">
      <option value="low">Low</option>
      <option value="med" selected>Medium</option>
      <option value="high">High</option>
    </select>
    <button id="full">⛶</button>
  </div>
  <div class="screen">
    <canvas id="cv" width="16" height="9"></canvas>
    <div id="overlay">Connecting…</div>
  </div>
  <div class="panel">
    <div class="tabs">
      <button data-tab="pad" class="on">Touchpad</button>
      <button data-tab="kb">Keyboard</button>
      <button data-tab="none">⌄</button>
    </div>

    <div class="tab active" id="tab-pad">
      <div class="speed">Speed <input id="spd" type="range" min="1" max="6" step="0.1" value="2.6"></div>
      <div class="padwrap">
        <div class="pad" id="pad">Drag to move<br>Tap = click · Two-finger tap = right-click<br>Two-finger drag = scroll</div>
        <div class="strip" id="strip">scroll</div>
        <div class="btns">
          <button id="bL">Left</button>
          <button id="bR">Right</button>
          <button id="bDrag">Drag</button>
        </div>
      </div>
    </div>

    <div class="tab" id="tab-kb"><div class="kb" id="kb"></div></div>
  </div>
</section>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const show = (id) => {
    document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === id));
  };

  /* ---------------- connection ---------------- */
  let token = sessionStorage.getItem('rp_token');
  let ws = null, wantConn = false, devices = [], curId = null, watching = false;

  const send = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };

  function connect() {
    wantConn = true;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/viewer`);
    ws.onopen = () => ws.send(JSON.stringify({ type: 'auth', token }));
    ws.onmessage = (ev) => {
      if (typeof ev.data !== 'string') return drawFrame(ev.data);
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'devices') { devices = m.devices; renderDevices(); syncWatch(); }
      else if (m.type === 'agent-left') { watching = false; setOverlay('PC went offline. Waiting for it to reconnect…'); }
    };
    ws.onclose = (ev) => {
      watching = false;
      if (ev.code === 4401) return logout('Session expired. Sign in again.');
      if (!wantConn) return;
      if (curId) setOverlay('Reconnecting…');
      setTimeout(() => { if (wantConn) connect(); }, 1500);
    };
  }

  function syncWatch() {
    if (!curId) return;
    const has = devices.some((d) => d.id === curId);
    if (!has) { watching = false; setOverlay('PC is offline. Waiting for it to reconnect…'); return; }
    if (!watching) {
      send({ type: 'watch', id: curId });
      send({ type: 'quality', preset: $('quality').value });
      watching = true;
    }
  }

  /* ---------------- login ---------------- */
  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('loginErr').textContent = '';
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: $('pw').value })
      });
      const j = await r.json();
      if (!r.ok) { $('loginErr').textContent = j.error || 'Login failed'; return; }
      token = j.token;
      sessionStorage.setItem('rp_token', token);
      $('pw').value = '';
      show('devices');
      connect();
    } catch {
      $('loginErr').textContent = 'Could not reach the server.';
    }
  });

  function logout(msg) {
    wantConn = false;
    sessionStorage.removeItem('rp_token');
    token = null; curId = null; watching = false;
    if (ws) { try { ws.close(); } catch {} }
    $('loginErr').textContent = msg || '';
    show('login');
  }
  $('logout').onclick = () => logout();

  /* ---------------- devices ---------------- */
  function renderDevices() {
    const list = $('devList');
    list.innerHTML = '';
    $('devEmpty').style.display = devices.length ? 'none' : 'block';
    devices.forEach((d) => {
      const el = document.createElement('div');
      el.className = 'dev';
      const label = document.createElement('div');
      label.innerHTML = '<span class="dot"></span>';
      label.append(document.createTextNode(d.name));
      const btn = document.createElement('button');
      btn.className = 'primary';
      btn.textContent = 'Connect';
      el.append(label, btn);
      el.onclick = () => openDevice(d);
      list.appendChild(el);
      list.style.cssText = 'display:flex;flex-direction:column;gap:10px';
    });
  }

  function openDevice(d) {
    curId = d.id; watching = false;
    $('title').textContent = d.name;
    setOverlay('Connecting to ' + d.name + '…');
    show('control');
    syncWatch();
  }

  $('back').onclick = () => {
    releaseDrag();
    send({ type: 'leave' });
    curId = null; watching = false;
    show('devices');
  };

  /* ---------------- screen ---------------- */
  const cv = $('cv'), ctx = cv.getContext('2d');
  const overlay = $('overlay');
  function setOverlay(t) { overlay.textContent = t; overlay.hidden = false; }

  let drawing = false, latest = null;
  async function drawFrame(blob) {
    latest = blob;
    if (drawing) return;
    drawing = true;
    while (latest) {
      const b = latest; latest = null;
      try {
        const bmp = await createImageBitmap(b);
        if (cv.width !== bmp.width || cv.height !== bmp.height) { cv.width = bmp.width; cv.height = bmp.height; }
        ctx.drawImage(bmp, 0, 0);
        bmp.close();
        overlay.hidden = true;
      } catch {}
    }
    drawing = false;
  }

  $('quality').onchange = () => send({ type: 'quality', preset: $('quality').value });
  $('full').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {});
  };

  // tap directly on the screen to move the cursor there and click
  let directTap = true, tapStart = null;
  $('directTap').onclick = (e) => { directTap = !directTap; e.currentTarget.classList.toggle('on', directTap); };
  cv.addEventListener('pointerdown', (e) => { tapStart = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  cv.addEventListener('pointerup', (e) => {
    if (!directTap || !tapStart) return;
    const moved = Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y);
    if (moved < 10 && performance.now() - tapStart.t < 400) {
      const r = cv.getBoundingClientRect();
      send({ type: 'abs', x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height });
      send({ type: 'click', button: 'left' });
    }
    tapStart = null;
  });

  /* ---------------- tabs ---------------- */
  document.querySelectorAll('.tabs button').forEach((b) => {
    b.onclick = () => {
      const t = b.dataset.tab;
      document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b && t !== 'none'));
      document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x.id === 'tab-' + t));
    };
  });

  /* ---------------- touchpad ---------------- */
  let accX = 0, accY = 0, scrollAcc = 0;
  const speed = () => parseFloat($('spd').value);
  setInterval(() => {
    const rx = Math.round(accX), ry = Math.round(accY);
    if (rx || ry) { send({ type: 'move', dx: rx, dy: ry }); accX -= rx; accY -= ry; }
    const n = Math.trunc(scrollAcc);
    if (n) { send({ type: 'scroll', dy: n }); scrollAcc -= n; }
  }, 16);
  const addScroll = (fingerDy) => { scrollAcc += -fingerDy / 24; };

  const pad = $('pad'), pts = new Map();
  let g = null;
  pad.addEventListener('pointerdown', (e) => {
    pad.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) g = { t: performance.now(), moved: 0, max: 1 };
    else if (g) g.max = Math.max(g.max, pts.size);
  });
  pad.addEventListener('pointermove', (e) => {
    const p = pts.get(e.pointerId);
    if (!p || !g) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    g.moved += Math.abs(dx) + Math.abs(dy);
    if (pts.size === 1) {
      const gain = speed() * (1 + Math.min(Math.hypot(dx, dy) / 14, 2));
      accX += dx * gain; accY += dy * gain;
    } else {
      addScroll(dy / 2);
    }
  });
  const endPtr = (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pts.size === 0 && g) {
      if (g.moved < 10 && performance.now() - g.t < 320) {
        send({ type: 'click', button: g.max >= 2 ? 'right' : 'left' });
      }
      g = null;
    }
  };
  pad.addEventListener('pointerup', endPtr);
  pad.addEventListener('pointercancel', endPtr);
  pad.addEventListener('wheel', (e) => { e.preventDefault(); scrollAcc += e.deltaY / 100; }, { passive: false });

  // dedicated scroll strip
  const strip = $('strip'); let sy = null;
  strip.addEventListener('pointerdown', (e) => { strip.setPointerCapture(e.pointerId); sy = e.clientY; });
  strip.addEventListener('pointermove', (e) => { if (sy === null) return; addScroll(e.clientY - sy); sy = e.clientY; });
  ['pointerup', 'pointercancel'].forEach((ev) => strip.addEventListener(ev, () => { sy = null; }));

  // left / right buttons (press and hold works for dragging)
  function holdBtn(el, btn) {
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); send({ type: 'down', button: btn }); });
    const up = () => send({ type: 'up', button: btn });
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  }
  holdBtn($('bL'), 'left');
  holdBtn($('bR'), 'right');

  // drag lock
  let dragOn = false;
  function releaseDrag() { if (dragOn) { send({ type: 'up', button: 'left' }); dragOn = false; $('bDrag').classList.remove('on'); } }
  $('bDrag').onclick = () => {
    dragOn = !dragOn;
    send({ type: dragOn ? 'down' : 'up', button: 'left' });
    $('bDrag').classList.toggle('on', dragOn);
  };

  /* ---------------- on-screen keyboard ---------------- */
  const MODS = ['shift', 'ctrl', 'alt', 'win'];
  const mods = { shift: false, ctrl: false, alt: false, win: false };
  const SHIFT = { '`': '~', '1': '!', '2': '@', '3': '#', '4': '$', '5': '%', '6': '^', '7': '&', '8': '*', '9': '(', '0': ')', '-': '_', '=': '+', '[': '{', ']': '}', '\\': '|', ';': ':', "'": '"', ',': '<', '.': '>', '/': '?' };
  const LABEL = { backspace: '⌫', enter: '⏎', left: '←', up: '↑', down: '↓', right: '→', win: '⊞', caps: '⇪', space: '␣', esc: 'Esc', tab: 'Tab', del: 'Del', ins: 'Ins', home: 'Home', end: 'End', pgup: 'PgUp', pgdn: 'PgDn', prtsc: 'PrtSc', shift: '⇧', ctrl: 'Ctrl', alt: 'Alt' };
  const WIDTH = { backspace: 1.9, tab: 1.5, '\\': 1.5, caps: 1.8, enter: 2.2, shift: 2.4, ctrl: 1.4, win: 1.2, alt: 1.2, space: 6 };
  const REPEAT = new Set(['backspace', 'left', 'right', 'up', 'down', 'del']);
  const QUICK = [
    ['⊞ Win', 'win', []], ['Alt+Tab', 'tab', ['alt']], ['Ctrl+C', 'c', ['ctrl']], ['Ctrl+V', 'v', ['ctrl']],
    ['Ctrl+X', 'x', ['ctrl']], ['Ctrl+A', 'a', ['ctrl']], ['Ctrl+Z', 'z', ['ctrl']], ['Win+D', 'd', ['win']],
    ['Win+R', 'r', ['win']], ['Alt+F4', 'f4', ['alt']]
  ];
  const LAYOUT = [
    'esc f1 f2 f3 f4 f5 f6 f7 f8 f9 f10 f11 f12 prtsc ins del home end pgup pgdn',
    '` 1 2 3 4 5 6 7 8 9 0 - = backspace',
    'tab q w e r t y u i o p [ ] \\',
    "caps a s d f g h j k l ; ' enter",
    'shift z x c v b n m , . / shift',
    'ctrl win alt space alt ctrl left up down right'
  ];

  const kbEl = $('kb'), keyEls = [];
  let rt1, rt2;
  const stopRepeat = () => { clearTimeout(rt1); clearInterval(rt2); };

  function hit(tok) {
    if (navigator.vibrate) navigator.vibrate(5);
    if (MODS.includes(tok)) { mods[tok] = !mods[tok]; return refreshKeys(); }
    const active = MODS.filter((m) => mods[m]);
    const plain = !mods.ctrl && !mods.alt && !mods.win;
    if (tok.length === 1 && plain) {
      send({ type: 'text', text: mods.shift ? (SHIFT[tok] || tok.toUpperCase()) : tok });
    } else {
      send({ type: 'key', key: tok, mods: active });
    }
    MODS.forEach((m) => { mods[m] = false; });
    refreshKeys();
  }

  function mkKey(tok, small) {
    const b = document.createElement('button');
    b.className = 'k' + (small ? ' sm' : '');
    b.dataset.k = tok;
    b.textContent = LABEL[tok] || tok;
    if (WIDTH[tok] && !small) b.style.setProperty('--w', WIDTH[tok]);
    if (small) {
      // scrollable rows use click so swiping the row doesn't press keys
      b.addEventListener('click', () => hit(tok));
    } else {
      b.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        hit(tok);
        if (REPEAT.has(tok)) { stopRepeat(); rt1 = setTimeout(() => { rt2 = setInterval(() => hit(tok), 55); }, 380); }
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, stopRepeat));
    }
    keyEls.push(b);
    return b;
  }

  function refreshKeys() {
    keyEls.forEach((b) => {
      const t = b.dataset.k;
      if (MODS.includes(t)) b.classList.toggle('on', mods[t]);
      else if (t.length === 1) b.textContent = mods.shift ? (SHIFT[t] || t.toUpperCase()) : t;
    });
  }

  // quick-action row
  const q = document.createElement('div');
  q.className = 'row scroll';
  QUICK.forEach(([label, key, m]) => {
    const b = document.createElement('button');
    b.className = 'k sm';
    b.textContent = label;
    b.addEventListener('click', () => { if (navigator.vibrate) navigator.vibrate(5); send({ type: 'key', key, mods: m }); });
    q.appendChild(b);
  });
  kbEl.appendChild(q);

  LAYOUT.forEach((line, i) => {
    const r = document.createElement('div');
    r.className = 'row' + (i === 0 ? ' scroll' : '');
    line.split(' ').forEach((t) => r.appendChild(mkKey(t, i === 0)));
    kbEl.appendChild(r);
  });

  /* ---------------- boot ---------------- */
  if (token) { show('devices'); connect(); }
})();
</script>
</body>
</html>
